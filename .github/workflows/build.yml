name: Build Word Candy AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Find project structure
        run: |
          ls -la
          find . -type f -name "*.gradle*" | head -20
      
      - name: Build AAB
        run: gradle bundleRelease
      
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: WordCandy-AAB
          path: "**/build/outputs/bundle/release/*.aab"
