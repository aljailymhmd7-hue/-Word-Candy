name: Build Word Candy AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PATH: my-upload-key.jks
      STORE_PASSWORD: upload123456
      KEY_PASSWORD: upload123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle
