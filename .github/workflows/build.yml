name: Build Word Candy AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Create dummy google-services.json
        run: |
          echo '{"project_info":{"project_number":"123456789","project_id":"word-candy-dummy","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:dummy","android_client_info":{"package_name":"com.elgaily.wordcandy"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}]}' > app/google-services.json
          ls -la app/google-services.json
      
      - name: Create dummy keystore
        run: |
          keytool -genkey -v -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-key-alias -storepass 123456 -keypass 123456 -dname "CN=WordCandy, OU=Game, O=Elgaily, L=Khartoum, S=Khartoum, C=SD"
          ls -la my-upload-key.jks
          pwd
      
      - name: Build AAB
        run: gradle bundleRelease --stacktrace
      
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: WordCandy-AAB
          path: "**/build/outputs/bundle/release/*.aab"
