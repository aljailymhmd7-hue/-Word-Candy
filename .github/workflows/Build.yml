name: build
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 9.3.1

      - name: make keystore
        run: |
          echo '{"project_info":{"project_number":"123","project_id":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:dummy","android_client_info":{"package_name":"com.elgaily.wordcandy"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{}}]}' > app/google-services.json
          keytool -genkey -v -keystore app/my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass upload123456 -keypass upload123456 -dname "CN=WordCandy" -noprompt
          mkdir -p app/app
          cp app/my-upload-key.jks app/app/my-upload-key.jks
          cp app/my-upload-key.jks my-upload-key.jks

      - name: build apk
        env:
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: upload123456
          KEY_PASSWORD: upload123456
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease -PversionCode="$BUILD_NUMBER" -PversionName="1.0.$BUILD_NUMBER" --no-configuration-cache
          else
            gradle assembleRelease -PversionCode="$BUILD_NUMBER" -PversionName="1.0.$BUILD_NUMBER" --no-configuration-cache
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: WordCandy-APK
          path: app/build/outputs/apk/release/*.apk
